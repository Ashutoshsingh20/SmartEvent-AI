<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | SmartEvent AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body data-page="dashboard">
    <header class="site-header compact">
      <a class="brand" href="index.html"><span>SmartEvent</span> AI</a>
      <button class="nav-toggle" aria-label="Open menu"><i class="fa-solid fa-bars"></i></button>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="events.html">Events</a>
        <a href="admin.html" id="nav-admin-link" hidden>Admin</a>
        <a class="auth-link" href="login.html">Login</a>
        <button class="icon-button theme-toggle" aria-label="Toggle theme"><i class="fa-solid fa-circle-half-stroke"></i></button>
      </nav>
    </header>
    <main class="app-shell">
      <nav class="tabs" aria-label="Dashboard tabs">
        <a href="#overview">Overview</a><a href="#events">My Events</a><a href="#tickets">Tickets</a><a href="#recommendations">Recommendations</a><a href="#notifications">Notifications</a><a href="#profile">Profile</a>
      </nav>
      <section id="dashboard-view">
        <div class="dashboard-hero"><div><div class="skeleton-pill"></div><div class="skeleton-line long" style="height:48px;margin-top:18px"></div></div></div>
        <div class="cards-grid"><article class="stat-card"><div class="skeleton-line short"></div><div class="skeleton-line medium" style="height:34px;margin-top:16px"></div></article><article class="stat-card"><div class="skeleton-line short"></div><div class="skeleton-line medium" style="height:34px;margin-top:16px"></div></article><article class="stat-card"><div class="skeleton-line short"></div><div class="skeleton-line medium" style="height:34px;margin-top:16px"></div></article><article class="stat-card"><div class="skeleton-line short"></div><div class="skeleton-line medium" style="height:34px;margin-top:16px"></div></article></div>
      </section>
    </main>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script type="module" src="js/firebase.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/registration.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
