<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin | SmartEvent AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body data-page="admin">
    <main class="admin-shell">
      <aside class="admin-sidebar">
        <a class="brand" href="index.html"><span>SmartEvent</span> AI</a>
        <nav>
          <a href="#overview"><i class="fa-solid fa-grid-2"></i>Overview</a>
          <a href="#events"><i class="fa-solid fa-calendar-days"></i>Events</a>
          <a href="#create"><i class="fa-solid fa-plus"></i>Create Event</a>
          <a href="#analytics"><i class="fa-solid fa-chart-line"></i>Analytics</a>
          <a href="#scanner"><i class="fa-solid fa-qrcode"></i>QR Scanner</a>
          <a href="#users"><i class="fa-solid fa-users"></i>Users</a>
          <a href="#settings"><i class="fa-solid fa-gear"></i>Settings</a>
        </nav>
        <button class="button ghost full" id="admin-logout">Logout</button>
      </aside>
      <section class="admin-main" id="admin-view">
        <div class="skeleton-pill"></div>
        <div class="skeleton-line long" style="height:48px;margin:18px 0 24px"></div>
        <div class="cards-grid"><article class="stat-card"><div class="skeleton-line short"></div><div class="skeleton-line medium" style="height:34px;margin-top:16px"></div></article><article class="stat-card"><div class="skeleton-line short"></div><div class="skeleton-line medium" style="height:34px;margin-top:16px"></div></article><article class="stat-card"><div class="skeleton-line short"></div><div class="skeleton-line medium" style="height:34px;margin-top:16px"></div></article><article class="stat-card"><div class="skeleton-line short"></div><div class="skeleton-line medium" style="height:34px;margin-top:16px"></div></article></div>
      </section>
    </main>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script type="module" src="js/firebase.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
